# Gitee Go pipeline for evorule-system-rules (宪法仓)
#
# 轻量面: python 族自检五门直跑（schema 闭环/文件头/金样例覆盖率/版本号纪律/docs 链接）。
# conformance 跨仓环测试、server 副本同步、rule 仓两门与宪法 crate 测试在 Gitee 侧
# 不执行（不 clone 跨仓/不在 python 镜像内跑 cargo），强制阻断由 GitHub 侧
# ci.yml 承担（mirror 后自动跑）。
#
# 2026-10-24（CON-D-02 收口）：原镜像 powershell:lts-nanoserver-1809 无 python
# ⇒ verify-all 预检必红、流水线实质失效；改为 python 官方镜像**直跑五道 python 门**
# （不再经 verify-all.ps1/pwsh 编排），镜像自带解释器零安装步骤。

stages:
  - validate
  - license

validate-all:
  stage: validate
  image: python:3.12-bookworm
  script:
    - python --version
    - pip install --quiet --upgrade jsonschema referencing
    - python tools/verify_schemas.py
    - python tools/check_schema_headers.py
    - python tools/check_golden_coverage.py
    - python tools/check_version_discipline.py
    - python tools/check_docs_links.py

# === Ecosystem license gate (parity with GitHub license-gate.yml @ pinned root commit) ===
license:
  stage: license
  image: rust:1.98.1-slim
  script:
    - test -f deny.toml || { echo 'FAIL: deny.toml missing'; exit 1; }
    # seven-pack presence (sync-licenses scope; cargo-deny not applicable to non-Cargo repos)
    - for f in LICENSE NOTICE.md DUAL_LICENSE.md COMMERCIAL_LICENSE.md FREE_COMMERCIAL_LICENSE.md CLA-individual.md CLA-corporate.md; do test -f "$f" || { echo "FAIL: missing $f"; exit 1; }; done
