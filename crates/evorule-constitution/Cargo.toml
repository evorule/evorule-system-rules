[package]
name = "evorule-constitution"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "evorule 宪法 jsonschema 校验组件——属地执法共享实现(见 docs/explanation/04-governance-scope.md 属地执法义务)"
repository = "https://gitee.com/evorule/evorule-system-rules"
build = "build.rs"

[dependencies]
serde_json = "1"
jsonschema = "0.21"

[build-dependencies]
serde_json = "1"

[dependencies.tracing]
version = "0.1"
optional = true

[features]
default = ["tracing"]
