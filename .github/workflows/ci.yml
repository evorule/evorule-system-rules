# CI for evorule-system-rules (宪法仓)
#
# 单 job = verify-all.ps1 总入口（[CON-L4-003] conformance 挂 CI）:
#   - python 环境预检 / verify_schemas / 文件头自检 / 金样例覆盖率(双向断言)
#   - 版本号纪律(无声版本禁令) / docs 链接 / server 内嵌副本一致性
#   - conformance 环测试（跨仓: checkout evorule-server 为兄弟目录, cargo 跑真装载路径）
#
# L4-004 双指标分工:
#   - 金样例覆盖率 = verify-all 内 check_golden_coverage 步（本仓原生 100% 红灯）
#   - 报错向导覆盖率（四段式模板测试）= evorule-server CI 的 K6 指标步
#     （scripts/check_k6_metrics.ps1，向导实现在 server 侧 rule_tools）
#
# GitHub 侧为强制阻断面（PR + push）；Gitee Go 受限降轻量面（.gitee-ci/validate.yml）。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  verify-all:
    name: verify-all (conformance + coverage + sync)
    runs-on: ubuntu-latest
    steps:
      # 本仓置于子目录, 使 evorule-server 成为兄弟目录（verify-all 跨仓定位约定）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: evorule-system-rules
          fetch-depth: 0 # 版本号纪律门（CON-G-003）需 diff vs origin/main，浅检出无基准分支必红

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule-server
          path: evorule-server

      # 白名单对齐闸（verify_schemas.py == 4.，安全语义硬对账不可 SKIP）的权威源仓：
      # 根仓（evorule-tcb dispatch / evorule-governance 白名单 / evorule-cli SSOT 引用）与 bundle 结构门禁
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule
          path: evorule

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule-bundle
          path: evorule-bundle

      # evorule-rule 检出（CON-D-01 收口）：激活 verify-all 的 rule 仓两道门——
      # data/ 资产守护（RG-1 件A3）+ 扩展层领域 schema 元纪律（SR-17 件3，
      # check_domain_meta.py）。缺此检出则两门走 [SKIP]，双权威消失判据之一
      # 不在执法链上（G-12）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: evorule/evorule-rule
          path: evorule-rule

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: python + jsonschema
        run: |
          python3 --version
          # 与 verify-all.ps1 的 `python` 探针同一解释器，避免 python/python3 环境分裂；
          # referencing 为 schema 工具链显式依赖（jsonschema 新版传递依赖，显式声明防旧版环境缺件）；
          # --upgrade 必须：runner 预装旧版 jsonschema 时 pip 缺省 already satisfied 跳过升级，
          # 导致 registry= 构造参数 TypeError（4.18+ 才支持）
          python -m pip install --quiet --upgrade jsonschema referencing

      - name: verify-all.ps1（含跨仓 conformance）
        working-directory: evorule-system-rules
        shell: pwsh
        env:
          # 根仓检出仅为白名单对齐闸提供权威源；根仓数据资产守护不随检出激活（根仓资产红走根仓自身批次）
          SR_SKIP_ROOT_SCAN: "1"
        run: pwsh -NoProfile -File ./verify-all.ps1

  # Ecosystem license gate (reusable workflow, pinned to root-repo commit)
  license-gate:
    name: license gate
    permissions:
      contents: read
    uses: evorule/evorule/.github/workflows/license-gate.yml@9d0e4fdbb28cfd0db1051c9014149f198b290e6b

